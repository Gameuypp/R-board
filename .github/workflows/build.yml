name: Build Rasi Keyboard

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout this repo (rasi.patch)
        uses: actions/checkout@v4
        with:
          path: rasi

      - name: Checkout FUTO Keyboard (with submodules)
        uses: actions/checkout@v4
        with:
          repository: futo-org/android-keyboard
          path: src
          submodules: recursive

      - name: Apply Rasi patch
        working-directory: src
        run: git apply --whitespace=nowarn ../rasi/rasi.patch

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK
        run: sdkmanager --install "ndk;28.2.13676358"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        working-directory: src
        run: |
          chmod +x gradlew
          ./gradlew assembleStableDebug --no-daemon --stacktrace

      - name: Collect APK
        run: |
          APK=$(find src -name "*.apk" -path "*tableDebug*" | head -n 1)
          echo "Found: $APK"
          cp "$APK" rasi-keyboard.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Rasi Keyboard build ${{ github.run_number }}
          files: rasi-keyboard.apk
